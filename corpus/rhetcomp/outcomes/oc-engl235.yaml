id: oc-engl235
institution: Olympic College
course: "ENGL& 235"
title: "Technical Writing"
credits: 5
catalog_description: "Problem-solving strategies, information literacy, and research for professional and technical writing settings."
catalog_prerequisite: "Successful completion of ENGL& 101 with a 2.0 or better or its equivalent."
source_urls:
  - "https://catalog.olympic.edu/preview_course_nopop.php?catoid=25&coid=53137"
retrieved: 2026-10-17
outcomes_status: supplied-by-instructor
outcomes_stem: "Students will"
outcomes_provided: >-
  Four outcomes supplied by Justin Lewis on 2026-10-18 for use in Aletheia. They were not
  found on the open web; the official text lives in OC's Curriculog (see notes), so check
  wording there before citing them as the official list. Topic and framework tags are
  Aletheia's, not OC's.
notes: >-
  Before the outcomes above were supplied, none were published on the open web for OC ENGL& 235.
  The 2026-27 OC catalog entry gives only the description, prerequisite,
  credits, and "5 hours Lecture." olympic.edu pages mention ENGL& 235 only in
  degree worksheets (AA-DTA, AS Track 1, BSCS, BAS OLTM). Other Washington
  colleges' ENGL& 235 outcomes (Bates, Big Bend, Cascadia, Tacoma, etc.) are
  not OC's and were not used. Per Justin's English Coordinator handbook
  (local: English Coordinator - Handbook/source/50_governance.md), "ENGL&235
  and composition outcomes are on the Adjunct Resources shell" (Canvas course
  2530513), and the official text is in OC's Curriculog. Paste it to fill
  `outcomes`. When filled, tag with tc: codes as well as wpa:/acrl: codes.
outcomes:
  - id: oc-engl235-1
    text: "Analyze the rhetorical situation and determine the appropriate audience or users of written and visual communications."
    frameworks: [wpa:rhetorical-knowledge, tc:audience-purpose]
    topics: [audience analysis, audience, rhetorical situation, visual rhetoric, document design, plain language, visual design]
  - id: oc-engl235-2
    text: "Create documents using the appropriate style, genre, and expository methods for effective communication in business, technical, and professional cultures and contexts."
    frameworks: [tc:genres-documents, tc:editing-style, wpa:knowledge-of-conventions]
    topics: [workplace writing, technical writing, business writing, genre, reports, proposals, memos, email, instructions, expository writing]
  - id: oc-engl235-3
    text: "Conduct research relevant to workplace problem solving using appropriate methods and documentation."
    frameworks: [tc:research-usability, acrl:research-inquiry, acrl:searching-strategic]
    topics: [research process, primary research, research methods, interviews, surveys, usability testing, source evaluation, citation, problem-solution, wicked problems]
  - id: oc-engl235-4
    text: "Demonstrate a cooperative work ethic and peer support in planning, researching, writing, revising, and presenting information."
    frameworks: [tc:collaboration, wpa:processes]
    topics: [collaboration, collaborative writing, teamwork, team project, peer review, project management, revision]
