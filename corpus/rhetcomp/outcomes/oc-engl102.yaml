id: oc-engl102
institution: Olympic College
course: "ENGL& 102"
title: "Composition II"
credits: 5
catalog_description: "A continuation of ENGL& 101 with emphasis on argumentation, research, and documentation."
catalog_prerequisite: "Successful completion of ENGL& 101 with a 2.0 or better or its equivalent."
source_urls:
  - "https://catalog.olympic.edu/preview_course_nopop.php?catoid=25&coid=53138"
retrieved: 2026-10-17
outcomes_status: supplied-by-instructor
outcomes_stem: "Students will"
outcomes_provided: >-
  Five outcomes supplied by Justin Lewis on 2026-10-18 for use in Aletheia. They were not
  found on the open web; the official text lives in OC's Curriculog (see notes), so check
  wording there before citing them as the official list. Topic and framework tags are
  Aletheia's, not OC's.
notes: >-
  Before the outcomes above were supplied, none were published on the open web for OC ENGL& 102.
  The 2026-27 OC catalog entry gives only the description, prerequisite,
  credits, "5 hours Lecture," and "Formerly ENGL 102." The olympic.edu
  English page and site search turned up nothing, and no statewide
  recommended outcome set exists for ENGL& 102 (the 2019 (de)Composing
  ENGL&101 work covered 101 only). Washington common course numbering
  standardizes number and title, not content. Per Justin's English
  Coordinator handbook (local: English Coordinator - Handbook/source/
  50_governance.md), the official outcomes are in OC's Curriculog and on the
  English Adjunct Resources Canvas shell (course 2530513); the department is
  mapping 101, 102, and 235 outcomes to the updated Core Abilities this year,
  so the Curriculog text may change during 2026-27. Paste the current
  Curriculog outcomes to fill `outcomes`.
outcomes:
  - id: oc-engl102-1
    text: "Use an inquiry-based process to generate topics and questions for the development of an original research project."
    frameworks: [acrl:research-inquiry, wpa:processes]
    topics: [research as inquiry, inquiry, research question, research questions, topic development, research topic selection, research process, brainstorming]
  - id: oc-engl102-2
    text: "Evaluate, analyze, and manage primary and secondary sources —may include peer-reviewed articles, books, literature, news, and contemporary reports, etc."
    frameworks: [acrl:authority, acrl:searching-strategic, wpa:critical-thinking-reading-composing]
    topics: [source evaluation, source types, scholarly sources, primary sources, lateral reading, search strategies, databases, library research, library resources, annotated bibliography, information literacy]
  - id: oc-engl102-3
    text: "Apply a process-based approach to the planning and writing of a major research-based argumentative paper, which includes peer review, revision, and editing with attention to academic writing conventions."
    frameworks: [wpa:processes, wpa:knowledge-of-conventions]
    topics: [research writing, research essay, research proposal, drafting, peer review, revision, editing, academic writing, counterargument]
  - id: oc-engl102-4
    text: "Demonstrate the ability to effectively use research in support of a thesis."
    frameworks: [acrl:scholarship-conversation, wpa:critical-thinking-reading-composing]
    topics: [thesis, thesis writing, evidence, synthesis, source integration, counterargument, argument]
  - id: oc-engl102-5
    text: "Attribute sources using appropriate academic citations and conventions."
    frameworks: [acrl:information-value, wpa:knowledge-of-conventions]
    topics: [citation, plagiarism, academic integrity, mla, apa, quoting and paraphrasing, citation management]
