id: wwu-eng302
institution: Western Washington University
course: "ENG 302"
title: "Technical Writing"
credits: 5
catalog_description: "Technical writing is strategic. Technical writers create meaningful communication that helps others get things done. The course moves from traditional technical writing such as reports and instructions to generative artificial intelligence and social media. Students will produce a range of written documents suited to their fields of study and professional interests."
catalog_description_previous: "The course covers a variety of technical genres and focuses on the ethical and social implications of a technical writer’s choices. Students engage with rhetorical and technical practices to create meaningful communication that both advocates for change and helps others get things done."
catalog_prerequisite: "ENG 101, or ENG 201, or ENG 203; junior status; or instructor permission."
wp_points: 3
