notes: >-
  Exact title confirmed: ENG 302 "Technical Writing" (5 credits, WP points 3).
  catalog_description is from the 2026-27 catalog; catalog_description_previous
  is the 2025-26 (archived) catalog text, so the description changed this
  year. No official course outcomes were found in the WWU catalog, on the
  English department's quarterly course-description pages (e.g.,
  https://chss.wwu.edu/english/spring-2026-course-descriptions, where each
  section has its own instructor-written blurb), or elsewhere on wwu.edu. The
  university-wide WP guidelines (https://library.wwu.edu/writing-requirements)
  are course-design requirements (feedback, revision expectations, share of
  grade from writing), not learning outcomes. Older "Learning Outcomes for
  Writing Proficiency" cited on 2000s-2016 WWU teaching-showcase pages were
  not used: they are secondary and dated. To fill `outcomes`, ask the English
  department or WWU Writing Instruction Support
  (WritingInstructionSupport@wwu.edu), or take them from a current ENG 302
  syllabus.
