id: wwu-eng101
institution: Western Washington University
course: "ENG 101"
title: "Writing Your Way Through WWU"
credits: 5
catalog_description: "A writing course designed to prepare students for college-level creative, critical, and reflective writing. Because writing looks and works differently in different contexts, this course teaches the rhetorical competencies that students need to write across multiple disciplines. The course introduces students both to the processes of building and analyzing ideas, and to ways of communicating those ideas in context-specific genres for targeted audiences. This course has the immediate goal of preparing students to succeed in their writing at Western, but it will also serve them personally and professionally. Students needing to satisfy Block A of the communications section of the General University Requirements, which ENG 101 does, are required to do so prior to completion of 45 credits. Students with a 4 or 5 AP score are encouraged to take this class so they can learn to adapt their test-taking skills to college coursework."
catalog_prerequisite: "May not be taken concurrently with ENG 100."
gur: ACOM
source_urls:
  - "https://catalog.wwu.edu/preview_course_nopop.php?catoid=23&coid=163591"
  - "https://firstyearwriting.wwu.edu/about"
  - "https://firstyearwriting.wwu.edu/english-101-writing-your-way-through-western"
retrieved: 2026-10-17
outcomes_status: official-program-level
outcomes_scope: >-
  Program-level "Student Learning Goals" of WWU's First-Year Writing program,
  which covers both ENG 100 and ENG 101. No ENG 101-specific outcome list is
  published.
outcomes_stem: "By the end of First Year Writing at Western, students should…"
notes: >-
  Title check: the 2026-27 catalog title is "Writing Your Way Through WWU"
  (same in the 2019-20 catalog); the FYW site spells it "Writing Your Way
  Through Western." "Writing and Critical Inquiry" is an older title that
  still appears on the WWU Libraries writing-requirements page
  (https://library.wwu.edu/writing-requirements). ENG 101 is the only course
  that satisfies the ACOM GUR. The FYW About page states the goals were
  designed "to align with the standards of the Council of Writing Program
  Administrators’ WPA Outcomes Statement for First-Year Composition." They are
  in fact WPA OS 3.0 bullets: goals 1 and 2 match WPA OS 3.0 word for word
  (Processes; Critical Thinking, Reading, and Composing); goal 3 is the WPA
  Rhetorical Knowledge bullet with "and/or use of technology" added; goal 4 is
  the WPA Knowledge of Conventions bullet with "citation" added. The FYW
  course page says all sections use a common syllabus designed by the
  Director of Composition; that syllabus is not public. Trailing semicolons
  and the leading "And" in goal 4 are as published.
outcomes:
  - id: wwu-eng101-1
    text: "Develop flexible strategies for reading, drafting, reviewing, collaborating, revising, rewriting, rereading, and editing;"
    frameworks: [wpa:processes]
    topics: [writing process, revision, peer review, collaboration]
  - id: wwu-eng101-2
    text: "Read a diverse range of texts, attending especially to relationships between assertion and evidence, to patterns of organization, to the interplay between verbal and nonverbal elements, and to how these features function for different audiences and situations;"
    frameworks: [wpa:critical-thinking-reading-composing]
    topics: [reading strategies, evidence, rhetorical analysis, multimodal, audience]
  - id: wwu-eng101-3
    text: "Develop facility in responding to a variety of situations and contexts calling for purposeful shifts in voice, tone, level of formality, design, medium, structure, and/or use of technology;"
    frameworks: [wpa:rhetorical-knowledge]
    topics: [rhetorical situation, style, document design, multimodal]
  - id: wwu-eng101-4
    text: "And understand why genre conventions for structure, paragraphing, tone, citation, and mechanics vary."
    frameworks: [wpa:knowledge-of-conventions]
    topics: [genre, citation, grammar, style]
related_outcome_sets:
