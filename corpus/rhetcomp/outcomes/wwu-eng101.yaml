      Assessment objectives written by the Faculty Senate's Committee on
      Undergraduate Education, "with input from a variety of stakeholders
      across campus," to assess ENG 101. Source is a draft committee report
      (Nov 28, 2023). These are not the FYW program's published goals and are
      not confirmed as adopted course outcomes.
    source_urls:
      - "https://facultysenate.wwu.edu/files/2023-11/draft_CUE_ACOM%20recommendations%20-%20Nov%2028%202023.pdf"
    outcomes:
