        text: "Students will demonstrate ability to engage in critical and reflective analysis of diverse perspectives and communication techniques"
        frameworks: [wpa:critical-thinking-reading-composing]
        topics: [rhetorical analysis, reflection, reading strategies]
      - id: wwu-cue-acom-2
        text: "Students will demonstrate ethical research and writing through locating, evaluating, and utilizing sources, to both develop and support their argument and discover what has been said and whose voice is missing"
        frameworks: [wpa:critical-thinking-reading-composing, acrl:scholarship-conversation, acrl:searching-strategic]
        topics: [source evaluation, information literacy, argument, evidence, ethics]
      - id: wwu-cue-acom-3
        text: "Students will demonstrate the ability to evaluate both scholarly and non-scholarly sources"
        frameworks: [wpa:critical-thinking-reading-composing, acrl:authority]
        topics: [source evaluation, information literacy]
      - id: wwu-cue-acom-4
        text: "Students will demonstrate understanding of how to craft comprehensible and effective arguments"
        frameworks: [wpa:critical-thinking-reading-composing]
        topics: [argument, evidence]
      - id: wwu-cue-acom-5
        text: "Students will be able to understand and navigate the stages of writing, from generating ideas to revising the final product"
        frameworks: [wpa:processes]
        topics: [writing process, revision]
      - id: wwu-cue-acom-6
