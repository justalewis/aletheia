# Crosswalk: catalog topic tags -> outcome framework codes.
#
# Aletheia uses this file to estimate which outcomes a reading or assignment can serve. Under each
# code, catalog topics sit in three tiers:
#   core     (0.8)   the topic is what the outcome is about
#   strong   (0.5)   the topic usually serves the outcome
#   related  (0.25)  the topic touches the outcome some of the time
# An item's topic score for a code combines its matching topics so that each extra match adds less
# than the one before: 1 - (1 - w1)(1 - w2)..., which stays below 1. One core topic gives 0.8, two
# give 0.96, and a lone related topic gives 0.25.
#
# Sample arcs count for more than topics. When an arc puts an item in a unit whose `outcomes` list a
# code, the item gets arc_core (core readings, major projects) or arc_optional (optional readings,
# short-term versions, activities) on top of its topic score. A unit that lists more than arc_focus
# codes spreads that weight across them (x arc_focus / number of codes), so a unit claiming five
# outcomes says less about each one than a unit claiming two. Each further unit that uses the item
# for the same code adds arc_extra (two at most). Arc weight counts in full once the item's own
# topics agree (a topic score of at least `strong`); an item with no matching topic for the code
# gets arc_unconfirmed of it, with a sliding scale in between. An item's stored score for a code is
# its topic score plus its arc score.
#
# The builder's coverage view counts an item toward an outcome once its score reaches
# map_threshold, so a lone related topic (0.25) is not enough and a lone strong topic (0.5) is. An item in an arc unit
# that claims a code, with no topic for that code, scores arc_unconfirmed (0.25) x the unit weight
# (about 0.4), which is also not enough: membership in a unit alone doesn't make a reading match.
#
# Topics must match the catalog vocabulary exactly, in lowercase. load_pack warns about topics that
# no reading or assignment uses and about codes that frameworks.yaml doesn't define.

weights:
  core: 0.8
  strong: 0.5
  related: 0.25
  arc_core: 1.5
  arc_optional: 1.2
  arc_focus: 3
  arc_extra: 0.15
  arc_unconfirmed: 0.25
  map_threshold: 0.5

